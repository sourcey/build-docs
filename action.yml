name: "Build Docs with Sourcey"
description: "Build static documentation from OpenAPI specs and markdown using Sourcey"
branding:
  icon: "book-open"
  color: "blue"

inputs:
  version:
    description: "Sourcey version to install"
    required: false
    default: "latest"
  config:
    description: "Path to sourcey.config.ts (default: auto-detect)"
    required: false
  spec:
    description: "Path to OpenAPI spec file (for standalone builds without config)"
    required: false
  output:
    description: "Output directory"
    required: false
    default: "docs"
  args:
    description: "Additional arguments to pass to sourcey build"
    required: false

outputs:
  output-dir:
    description: "Path to the generated documentation"
    value: ${{ steps.build.outputs.output-dir }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install Sourcey
      shell: bash
      env:
        SOURCEY_VERSION: ${{ inputs.version }}
      run: npm install --no-save --package-lock=false "sourcey@$SOURCEY_VERSION"

    - name: Build docs
      id: build
      shell: bash
      env:
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_SPEC: ${{ inputs.spec }}
      run: |
        ARGS=()
        if [ -n "$INPUT_CONFIG" ]; then
          ARGS+=(--config "$INPUT_CONFIG")
        elif [ -n "$INPUT_SPEC" ]; then
          ARGS+=("$INPUT_SPEC")
        fi
        if [ -n "$INPUT_OUTPUT" ]; then
          ARGS+=(--output "$INPUT_OUTPUT")
        fi
        if [ -n "$INPUT_ARGS" ]; then
          read -r -a EXTRA_ARGS <<< "$INPUT_ARGS"
          ARGS+=("${EXTRA_ARGS[@]}")
        fi
        "$GITHUB_WORKSPACE/node_modules/.bin/sourcey" build "${ARGS[@]}"
        echo "output-dir=$INPUT_OUTPUT" >> "$GITHUB_OUTPUT"
